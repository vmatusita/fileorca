<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FileOrca · NumberField</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script>(function(){var t=new URLSearchParams(location.search).get("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><clipPath id="oli-clip"><path d="M14 74 C14 50 32 34 56 34 C80 34 96 46 104 60 C100 76 90 88 74 94 C58 100 34 99 24 92 C17 87 14 81 14 74 Z"/></clipPath></defs></svg>
<div class="fo-stage" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;max-width:720px">
<div class="fo-field"><label class="fo-field__label" for="a">Home price</label><div class="fo-input"><span class="fo-input__affix">$</span><input id="a" inputmode="decimal" value="420,000"></div></div>
<div class="fo-field"><label class="fo-field__label" for="b">Interest rate <span class="fo-tag">example</span></label><div class="fo-input"><input id="b" inputmode="decimal" value="6.5"><span class="fo-input__affix">%</span></div><p class="fo-field__help">Type the rate your lender quoted.</p></div>
<div class="fo-field"><label class="fo-field__label" for="c">Loan term</label><div class="fo-input"><select id="c"><option>30 years</option><option>15 years</option></select></div></div>
<div class="fo-field" data-state="error"><label class="fo-field__label" for="d">Down payment</label><div class="fo-input"><span class="fo-input__affix">$</span><input id="d" inputmode="decimal" value="520,000" aria-invalid="true" aria-describedby="de"></div><p class="fo-field__error" id="de"><svg class="fo-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01" stroke-width="2.6"/></svg>Can't be more than the home price</p></div>
<div class="fo-field" lang="pt"><label class="fo-field__label" for="e">Valor do imóvel</label><div class="fo-input"><span class="fo-input__affix">R$</span><input id="e" inputmode="decimal" value="450.000,00"></div></div>
</div>
</body>
</html>
