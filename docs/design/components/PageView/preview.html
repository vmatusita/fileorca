<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FileOrca · PageView</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script>(function(){var t=new URLSearchParams(location.search).get("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);})();</script>
<style>
/* The CSS of the page view and of the cells it opens from, as src/styles/components.css has it (F14), with the
   border-box the site's preflight gives (the bundle has none). The demo classes start with pv- so they never meet the
   .fo-page of the bundle (the ToolPage preview). */
.pv-demo *, .pv-demo *::before, .pv-demo *::after { box-sizing: border-box; }
.pv-demo { display: grid; gap: var(--space-5); }
.pv-demo h2.pv-label { margin: 0; font: 600 14px/20px var(--fo-font-text); color: var(--ink-muted); }
.pv-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: var(--space-3); }
.pv-cell { display: grid; grid-template-rows: 1fr; gap: var(--space-1); padding: var(--space-2); border: var(--stroke-2) solid var(--stroke); border-radius: var(--radius-md); background: var(--surface); }
.pv-cell[data-selected="true"] { border-color: var(--brand); border-width: var(--stroke-3); padding: calc(var(--space-2) - 1px); }
.pv-main { grid-area: 1 / 1; display: grid; grid-template-rows: 1fr auto; gap: var(--space-1); justify-items: center; padding: 0; border: 0; background: transparent; color: var(--ink); font: 600 14px/18px var(--fo-font-text); cursor: pointer; }
.pv-sheet { position: relative; display: block; align-self: end; width: 100%; aspect-ratio: var(--sheet-ratio, 0.7727); border-radius: var(--radius-xs); background: var(--surface-sunken); box-shadow: 0 0 0 var(--stroke-hair) var(--hairline); overflow: hidden; }
.pv-sheet svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pv-cell[data-leaving="true"] .pv-sheet svg { opacity: 0.4; }
.pv-n { justify-self: start; display: inline-flex; align-items: center; gap: var(--space-2); min-height: var(--tap-min); padding-right: calc(var(--tap-min) + var(--space-1)); }
.pv-check { display: inline-grid; place-items: center; width: 24px; height: 24px; border: var(--stroke-2) solid var(--stroke); border-radius: var(--radius-pill); background: var(--surface); color: var(--on-brand); }
.pv-check .fo-icon { width: 16px; height: 16px; stroke-width: 3; }
.pv-cell[data-selected="true"] .pv-check { background: var(--brand); border-color: var(--brand-edge); }
.pv-zoom { grid-area: 1 / 1; align-self: end; justify-self: end; z-index: 1; }
.fo-pview { display: grid; gap: var(--space-3); min-width: 0; }
.fo-pview__top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.fo-pview__title { flex: 1 0 auto; margin: 0; font: 600 18px/24px var(--fo-font-display); color: var(--ink); }
.fo-pview .fo-btn { padding-inline: var(--space-4); }
.fo-pview__back .fo-icon, .fo-pview__prev .fo-icon { rotate: 180deg; }
.fo-pview__frame { justify-self: center; width: min(100%, 26rem); border-radius: var(--radius-xs); }
.fo-pview__sheet { position: relative; display: block; width: 100%; aspect-ratio: 0.7727; overflow: hidden; border-radius: inherit; background: var(--surface-sunken); box-shadow: 0 0 0 var(--stroke-hair) var(--hairline); }
.fo-pview__sheet svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.fo-pview__bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-2); }
.fo-pview__prev { justify-self: start; }
.fo-pview__next { justify-self: end; }
.fo-pview__act[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); }
.fo-pview [aria-disabled="true"] { opacity: 0.55; cursor: default; }
@media (max-width: 479px) {
  .fo-pview__title { flex-basis: 100%; }
  .fo-pview__top { justify-content: space-between; }
  .fo-pview__bar { grid-template-columns: 1fr 1fr; }
  .fo-pview__act { grid-column: 1 / -1; grid-row: 1; }
  .fo-pview__prev, .fo-pview__next { justify-self: stretch; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><clipPath id="oli-clip"><path d="M14 74 C14 50 32 34 56 34 C80 34 96 46 104 60 C100 76 90 88 74 94 C58 100 34 99 24 92 C17 87 14 81 14 74 Z"/></clipPath>
<symbol id="pv-page" viewBox="0 0 85 110"><rect width="85" height="110" style="fill:var(--surface)"/><g style="stroke:var(--ink-muted)" stroke-width="1.6" stroke-linecap="round"><path d="M10 14h34"/><path d="M10 24h64M10 30h60M10 36h64M10 42h52"/><path d="M10 54h64M10 60h58M10 66h64"/><path d="M10 96h20"/></g></symbol>
<symbol id="pv-wide" viewBox="0 0 110 85"><rect width="110" height="85" style="fill:var(--surface)"/><g style="stroke:var(--ink-muted)" stroke-width="1.6" stroke-linecap="round"><path d="M10 14h40"/><path d="M10 26h90M10 32h84M10 38h90"/><path d="M10 72h20"/></g></symbol>
</defs></svg>
<div class="fo-stage pv-demo" style="max-width:560px">
  <h2 class="pv-label">The grid of Delete: a page standing, a page picked (it comes out), a page lying</h2>
  <ul class="pv-grid" aria-label="Pages of report.pdf">
    <li class="pv-cell">
      <button type="button" class="pv-main" aria-pressed="false" aria-label="Page 1 of 3">
        <span class="pv-sheet" style="--sheet-ratio:0.7727"><svg aria-hidden="true"><use href="#pv-page"/></svg></span>
        <span class="pv-n" aria-hidden="true"><span class="pv-check"></span>1</span>
      </button>
      <button type="button" class="fo-btn fo-btn--icon pv-zoom" aria-label="View page 1 enlarged"><svg class="fo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/><path d="M11 8.5v5M8.5 11h5"/></svg></button>
    </li>
    <li class="pv-cell" data-selected="true" data-leaving="true">
      <button type="button" class="pv-main" aria-pressed="true" aria-label="Page 2 of 3, comes out">
        <span class="pv-sheet" style="--sheet-ratio:0.7727"><svg aria-hidden="true"><use href="#pv-page"/></svg></span>
        <span class="pv-n" aria-hidden="true"><span class="pv-check"><svg class="fo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 7h15"/><path d="M10 3.5h4"/><path d="m6.5 7 1 12.5a1.5 1.5 0 0 0 1.5 1.5h6a1.5 1.5 0 0 0 1.5-1.5l1-12.5"/></svg></span>2</span>
      </button>
      <button type="button" class="fo-btn fo-btn--icon pv-zoom" aria-label="View page 2 enlarged"><svg class="fo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/><path d="M11 8.5v5M8.5 11h5"/></svg></button>
    </li>
    <li class="pv-cell">
      <button type="button" class="pv-main" aria-pressed="false" aria-label="Page 3 of 3">
        <span class="pv-sheet" style="--sheet-ratio:1.2941"><svg aria-hidden="true"><use href="#pv-wide"/></svg></span>
        <span class="pv-n" aria-hidden="true"><span class="pv-check"></span>3</span>
      </button>
      <button type="button" class="fo-btn fo-btn--icon pv-zoom" aria-label="View page 3 enlarged"><svg class="fo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/><path d="M11 8.5v5M8.5 11h5"/></svg></button>
    </li>
  </ul>

  <h2 class="pv-label">The page view in "Fit", page 1 of 3, from the magnifier of Delete (the page comes out)</h2>
  <div class="fo-pview">
    <div class="fo-pview__top">
      <h2 class="fo-pview__title" tabindex="-1">Page 1 of 3</h2>
      <button type="button" class="fo-btn fo-pview__size">Enlarge</button>
      <button type="button" class="fo-btn fo-btn--ghost fo-pview__back"><svg class="fo-icon fo-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>Back to the pages</button>
    </div>
    <div class="fo-pview__frame" role="group" aria-label="Page 1 enlarged">
      <div class="fo-pview__sheet"><svg aria-hidden="true"><use href="#pv-page"/></svg></div>
    </div>
    <div class="fo-pview__bar">
      <button type="button" class="fo-btn fo-pview__prev" aria-disabled="true"><svg class="fo-icon fo-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>Previous</button>
      <button type="button" class="fo-btn fo-pview__act" aria-pressed="true">Take this page out</button>
      <button type="button" class="fo-btn fo-pview__next">Next<svg class="fo-icon fo-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>
  </div>
</div>
</body>
</html>
