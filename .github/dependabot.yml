# Dependabot (F8, decisions 11 and 12; DECISOES § 298 and § 299). Once a month, on the 1st at 06:00 in São Paulo:
# one PR with every minor and patch of each ecosystem, which the CI merges on its own when pnpm verificar is green
# (scripts/ci/pode-mesclar.ts), and one PR per major, which waits for Victor. The PRs of GitHub Actions touch
# .github/workflows/, so they always wait for him too (docs/OPERACAO.md). No labels, no reviewers, no secret.
version: 2
updates:
  - package-ecosystem: npm
    # pnpm: the npm ecosystem reads pnpm-lock.yaml (lockfile 9.0, pnpm 10 by packageManager).
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: America/Sao_Paulo
    # Nothing published less than a week ago: the guard of the F1a against a package of the same day.
    cooldown:
      default-days: 7
    # The group and up to two majors; each PR runs the whole CI (about 130 minutes of Actions).
    open-pull-requests-limit: 3
    # Rewrites exact and "~" ranges to the new version instead of widening them with "||".
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Node stays on the major of .node-version (DECISOES § 17 and § 37); its types follow it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 6.1 and 7 break @astrojs/check and typescript-eslint (DECISOES § 17 and § 298): by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # qrcode is rewritten as ES modules by version and its license notice is pinned by SHA-256 (DECISOES § 271 and § 298).
      - dependency-name: qrcode
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
