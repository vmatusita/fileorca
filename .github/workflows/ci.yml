# CI of every PR (ADR-001, item 5; ADR-003 and its adendos). Since the F9 (DECISOES § 323 to § 340) one execution is:
#   classificar  the class of the execution, from scripts/ci/classificar.ts of the base branch: leve (a draft without the
#                `ci` label), portões (a ready PR, or a draft with the label, that changes only documentation) or completo.
#   leve         leve only: tipos, lint, the build and Vitest in one job (pnpm verificar --leve).
#   build        portões and completo: the one build of the execution (pnpm verificar --build), uploaded as the artifact
#                `site` (dist/ and .cache/bundle-modules.json, kept 1 day) that every part below downloads.
#   portoes      portões and completo: every gate but Playwright and Lighthouse, on that dist/ (--dist-pronto).
#   lighthouse   completo: Lighthouse alone, on that dist/.
#   playwright   completo: the suite in parts (Chromium in five, WebKit in thirteen; F5a, F7, F8 and the languages
#                adjustment), on that dist/. The browser and its system packages install in the background while the job
#                sets up Node and pnpm, so the setup fits in 90 s (DECISOES § 325). Core dumps stay off and every part
#                ends with the state of the disk and of the core dumps, whatever happened (the ENOSPC of § 141; § 154).
#   ci-ok        always (a skipped job counts as passed in a required check): green only when the class came out and
#                every job it asks for passed, from scripts/ci/ci-ok.ts of the base branch. The one check the ruleset of
#                docs/ops/ruleset-main.json requires. It reads the draft state of the PR as it is now: a leve run of a
#                PR that is already ready is red.
#   merge        after a green ci-ok, never for a draft or a fork: scripts/ci/pode-mesclar.ts of the base decides, and
#                the post-deploy check runs when the merge happened (a merge made with the GITHUB_TOKEN does not fire
#                `push`, so it is called here).
# Jobs skip by `if`, never by `paths` in `on:`, which would leave a required check pending forever. Each part keeps the
# 900 s limit; together the parts are the whole of pnpm verificar, with the build once (tests/unit/verificar.test.ts).
# F8: a Dependabot PR whose CI went red tells Victor in an issue assigned to him and in the PR (alerta-dependabot;
# DECISOES § 300), and every issue the workflows open is assigned to the owner of the repository (DECISOES § 301).
# F9: the jobs that write (merge, alerta-dependabot and pos-deploy) never run for a PR from a fork (DECISOES § 333).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The class of the execution (DECISOES § 326). Any label recomputes it, like a push; removing one runs nothing.
  classificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      classe: ${{ steps.classify.outputs.classe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Classify
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # The script comes from the base branch, so a PR cannot change the class of its own run. Only the PR that
          # creates it (no script on the base yet) uses its own copy.
          mkdir -p "$RUNNER_TEMP/ci"
          if git cat-file -e "$BASE_SHA:scripts/ci/classificar.ts" 2>/dev/null; then
            git show "$BASE_SHA:scripts/ci/classificar.ts" > "$RUNNER_TEMP/ci/classificar.ts"
          else
            cp scripts/ci/classificar.ts "$RUNNER_TEMP/ci/classificar.ts"
          fi
          # A diff that cannot be read counts as code: the class is completo.
          if ! git -c core.quotePath=false diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/files.txt"; then
            echo "::warning::git diff failed: the execution counts as complete"
            : > "$RUNNER_TEMP/files.txt"
          fi
          jq -n --argjson draft "$DRAFT" --argjson labels "$LABELS" --rawfile files "$RUNNER_TEMP/files.txt" \
            '{isDraft: $draft, labels: $labels, files: ($files | split("\n") | map(select(length > 0)) | map({path: .}))}' \
            > "$RUNNER_TEMP/pr.json"
          node "$RUNNER_TEMP/ci/classificar.ts" "$RUNNER_TEMP/pr.json"

  # A draft without the `ci` label: one job builds for the Vitest and checks the code (DECISOES § 326).
  leve:
    name: verificar (leve)
    needs: classificar
    if: needs.classificar.outputs.classe == 'leve'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The Vitest reads the history (HEAD~1 and older commits).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm verificar --leve
        run: pnpm verificar --leve

  # The one build of the execution (DECISOES § 324).
  build:
    needs: classificar
    if: needs.classificar.outputs.classe == 'portões' || needs.classificar.outputs.classe == 'completo'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Without the 392 MB of screenshots of docs/relatorios/, which no build, Playwright or Lighthouse step reads: the
          # shallow checkout of the whole tree took up to 132 s on a slow day (DECISOES § 325).
          sparse-checkout: |
            /*
            !/docs/relatorios/
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm verificar --build
        run: pnpm verificar --build
      # .cache/ is hidden, so it needs include-hidden-files; the Playwright budgets and the license gate read the record.
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            dist/
            .cache/bundle-modules.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  portoes:
    name: verificar (portões)
    needs: [classificar, build]
    if: needs.classificar.outputs.classe == 'portões' || needs.classificar.outputs.classe == 'completo'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # lint:texto diffs against the base and the Vitest reads the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only the folders of the pinned tools (scripts/lib/tools.ts), not the whole .cache/: the builds of the readiness
      # gate and a stale bundle record stay out (DECISOES § 328). It comes back before the build anyway.
      - name: Cache pinned tools (actionlint, shellcheck, LanguageTool, JRE)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/actionlint-*
            .cache/shellcheck-*
            .cache/languagetool-*
            .cache/jre-*
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/lib/tools.ts') }}
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: .
      - name: pnpm verificar --sem-playwright --sem-lighthouse --dist-pronto
        run: pnpm verificar --sem-playwright --sem-lighthouse --dist-pronto
        env:
          LINT_TEXTO_BASE: origin/${{ github.event.pull_request.base.ref }}

  lighthouse:
    name: verificar (lighthouse)
    needs: [classificar, build]
    if: needs.classificar.outputs.classe == 'completo'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/docs/relatorios/
          sparse-checkout-cone-mode: false
      # Lighthouse runs on the Chromium of Playwright: it installs in the background while the job sets up (§ 325).
      - name: Browser in the background
        env:
          BROWSER: chromium
        run: |
          version=$(sed -n "s/^  '@playwright\/test@\([0-9][0-9.]*\)':$/\1/p" pnpm-lock.yaml | head -n 1)
          test -n "$version" || { echo "no @playwright/test version in pnpm-lock.yaml"; exit 1; }
          echo "Playwright $version, $BROWSER, $(nproc) vCPU"
          # dpkg without fsync and without the man-db trigger: the apt of WebKit unpacks about 180 packages (DECISOES § 325).
          sudo rm -f /var/lib/man-db/auto-update
          echo force-unsafe-io | sudo tee /etc/dpkg/dpkg.cfg.d/90-fileorca-unsafe-io > /dev/null
          mkdir -p "$RUNNER_TEMP/navegador"
          # The system packages, then the browser, each with its time in the log ([navegador] lines).
          # shellcheck disable=SC2016 # the inner script reads its own positional arguments
          setsid nohup bash -c 'start=$(date +%s); npx --yes "playwright@$1" install-deps "$2"; deps=$?; mid=$(date +%s); echo "[navegador] pacotes do sistema: $((mid - start)) s, saída $deps"; npx --yes "playwright@$1" install "$2"; got=$?; echo "[navegador] navegador: $(($(date +%s) - mid)) s, saída $got"; [ "$deps" = 0 ] && [ "$got" = 0 ]; echo "$?" > "$3/status"' _ "$version" "$BROWSER" "$RUNNER_TEMP/navegador" > "$RUNNER_TEMP/navegador/log" 2>&1 < /dev/null &
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for the browser
        run: |
          # Up to 1200 s, under the 30 min of the job: the apt of a slow mirror took more than 300 s once (DECISOES § 325).
          for _ in $(seq 1 1200); do
            test -s "$RUNNER_TEMP/navegador/status" && break
            sleep 1
          done
          # The time of each phase and what apt downloaded, to tell a slow mirror from a slow dpkg (DECISOES § 325).
          grep -E '^(\[navegador\]|Fetched )' "$RUNNER_TEMP/navegador/log" || true
          if [ "$(cat "$RUNNER_TEMP/navegador/status" 2>/dev/null)" != 0 ]; then
            tail -n 40 "$RUNNER_TEMP/navegador/log"
            exit 1
          fi
      - name: pnpm verificar --lighthouse --dist-pronto
        run: pnpm verificar --lighthouse --dist-pronto

  playwright:
    name: playwright (${{ matrix.part }})
    needs: [classificar, build]
    if: needs.classificar.outputs.classe == 'completo'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: chromium 1 de 8
            browser: chromium
            args: --playwright=chromium --shard=1/8
          - part: chromium 2 de 8
            browser: chromium
            args: --playwright=chromium --shard=2/8
          - part: chromium 3 de 8
            browser: chromium
            args: --playwright=chromium --shard=3/8
          - part: chromium 4 de 8
            browser: chromium
            args: --playwright=chromium --shard=4/8
          - part: chromium 5 de 8
            browser: chromium
            args: --playwright=chromium --shard=5/8
          - part: chromium 6 de 8
            browser: chromium
            args: --playwright=chromium --shard=6/8
          - part: chromium 7 de 8
            browser: chromium
            args: --playwright=chromium --shard=7/8
          - part: chromium 8 de 8
            browser: chromium
            args: --playwright=chromium --shard=8/8
          - part: webkit 1 de 14
            browser: webkit
            args: --playwright=webkit --shard=1/14
          - part: webkit 2 de 14
            browser: webkit
            args: --playwright=webkit --shard=2/14
          - part: webkit 3 de 14
            browser: webkit
            args: --playwright=webkit --shard=3/14
          - part: webkit 4 de 14
            browser: webkit
            args: --playwright=webkit --shard=4/14
          - part: webkit 5 de 14
            browser: webkit
            args: --playwright=webkit --shard=5/14
          - part: webkit 6 de 14
            browser: webkit
            args: --playwright=webkit --shard=6/14
          - part: webkit 7 de 14
            browser: webkit
            args: --playwright=webkit --shard=7/14
          - part: webkit 8 de 14
            browser: webkit
            args: --playwright=webkit --shard=8/14
          - part: webkit 9 de 14
            browser: webkit
            args: --playwright=webkit --shard=9/14
          - part: webkit 10 de 14
            browser: webkit
            args: --playwright=webkit --shard=10/14
          - part: webkit 11 de 14
            browser: webkit
            args: --playwright=webkit --shard=11/14
          - part: webkit 12 de 14
            browser: webkit
            args: --playwright=webkit --shard=12/14
          - part: webkit 13 de 14
            browser: webkit
            args: --playwright=webkit --shard=13/14
          - part: webkit 14 de 14
            browser: webkit
            args: --playwright=webkit --shard=14/14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/docs/relatorios/
          sparse-checkout-cone-mode: false
      # The browser of the Playwright version in the lockfile and its system packages (the apt of WebKit is the slow part)
      # install in the background while the job downloads the build and sets up Node and pnpm (DECISOES § 325). setsid and
      # the redirections let the step end while the install goes on; the wait step reads its status.
      - name: Browser in the background
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          version=$(sed -n "s/^  '@playwright\/test@\([0-9][0-9.]*\)':$/\1/p" pnpm-lock.yaml | head -n 1)
          test -n "$version" || { echo "no @playwright/test version in pnpm-lock.yaml"; exit 1; }
          echo "Playwright $version, $BROWSER, $(nproc) vCPU"
          # dpkg without fsync and without the man-db trigger: the apt of WebKit unpacks about 180 packages (DECISOES § 325).
          sudo rm -f /var/lib/man-db/auto-update
          echo force-unsafe-io | sudo tee /etc/dpkg/dpkg.cfg.d/90-fileorca-unsafe-io > /dev/null
          mkdir -p "$RUNNER_TEMP/navegador"
          # The system packages, then the browser, each with its time in the log ([navegador] lines).
          # shellcheck disable=SC2016 # the inner script reads its own positional arguments
          setsid nohup bash -c 'start=$(date +%s); npx --yes "playwright@$1" install-deps "$2"; deps=$?; mid=$(date +%s); echo "[navegador] pacotes do sistema: $((mid - start)) s, saída $deps"; npx --yes "playwright@$1" install "$2"; got=$?; echo "[navegador] navegador: $(($(date +%s) - mid)) s, saída $got"; [ "$deps" = 0 ] && [ "$got" = 0 ]; echo "$?" > "$3/status"' _ "$version" "$BROWSER" "$RUNNER_TEMP/navegador" > "$RUNNER_TEMP/navegador/log" 2>&1 < /dev/null &
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for the browser
        run: |
          # Up to 1200 s, under the 30 min of the job: the apt of a slow mirror took more than 300 s once (DECISOES § 325).
          for _ in $(seq 1 1200); do
            test -s "$RUNNER_TEMP/navegador/status" && break
            sleep 1
          done
          # The time of each phase and what apt downloaded, to tell a slow mirror from a slow dpkg (DECISOES § 325).
          grep -E '^(\[navegador\]|Fetched )' "$RUNNER_TEMP/navegador/log" || true
          if [ "$(cat "$RUNNER_TEMP/navegador/status" 2>/dev/null)" != 0 ]; then
            tail -n 40 "$RUNNER_TEMP/navegador/log"
            exit 1
          fi
      # The runner pipes core dumps to systemd-coredump with a fixed size limit in its core_pattern, so ulimit -c 0 alone
      # does not stop them: the pattern goes to /bin/false for the job, and ulimit -c 0 stays in the step (DECISOES § 154).
      - name: Core dumps off
        run: |
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"
          sudo -n sysctl -w kernel.core_pattern='|/bin/false'
      - name: pnpm verificar ${{ matrix.args }} --dist-pronto
        run: |
          ulimit -c 0
          pnpm verificar ${{ matrix.args }} --dist-pronto
      - name: Disk and core dumps
        if: always()
        run: |
          df -h / /tmp || true
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"
          coredumpctl list --no-pager || true
          journalctl --no-pager -t systemd-coredump -n 40 || true
          sudo -n journalctl -k --no-pager | grep -iE 'oom|killed process|segfault|coredump|no space' | tail -30 || true
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7

  # The one check that sums up the CI (DECISOES § 327). It always runs, because a skipped job counts as passed in a
  # required check, and it reads its rule from the base branch, so a PR cannot turn its own check green.
  # The class comes from the payload of the event; the draft state of the PR is read again here (PR_DRAFT_NOW), so a
  # leve run of a PR that is already ready is red (the review of the F9, A-2). The step is green only when the output of
  # the script has the line "ci-ok: verde": a script that never reaches its verdict (an older Node without
  # import.meta.main, from the .node-version of the PR) fails the step too (A-4).
  ci-ok:
    name: ci-ok
    needs: [classificar, leve, build, portoes, lighthouse, playwright]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ci"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git cat-file -e "$BASE_SHA:scripts/ci/ci-ok.ts" 2>/dev/null; then
            git show "$BASE_SHA:scripts/ci/ci-ok.ts" > "$RUNNER_TEMP/ci/ci-ok.ts"
          else
            cp scripts/ci/ci-ok.ts "$RUNNER_TEMP/ci/ci-ok.ts"
          fi
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          PR_DRAFT_NOW=$(gh api "repos/$GH_REPO/pulls/$PR" --jq .draft)
          export PR_DRAFT_NOW
          node "$RUNNER_TEMP/ci/ci-ok.ts" "$RUNNER_TEMP/needs.json" | tee "$RUNNER_TEMP/ci-ok.log"
          grep -qx 'ci-ok: verde' "$RUNNER_TEMP/ci-ok.log"

  # The status function and the result of ci-ok are explicit: with the implicit success(), GitHub also looks at the jobs
  # before ci-ok, and the leve job is always skipped in a complete run, so the merge was skipped too (DECISOES § 327).
  merge:
    needs: ci-ok
    if: needs.ci-ok.result == 'success' && !cancelled() && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      sha: ${{ steps.merge.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      OWNER: ${{ github.repository_owner }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Dependabot metadata
        id: dependabot
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Decide
        id: decide
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DRAFT: ${{ github.event.pull_request.draft }}
          UPDATE_TYPE: ${{ steps.dependabot.outputs.update-type }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          # The decision script comes from the base branch, so a PR cannot change its own rule.
          # Only the PR that creates the pipeline (no script on the base yet) uses its own copy.
          mkdir -p "$RUNNER_TEMP/ci"
          if git cat-file -e "$BASE_SHA:scripts/ci/pode-mesclar.ts" 2>/dev/null; then
            git show "$BASE_SHA:scripts/ci/pode-mesclar.ts" > "$RUNNER_TEMP/ci/pode-mesclar.ts"
          else
            cp scripts/ci/pode-mesclar.ts "$RUNNER_TEMP/ci/pode-mesclar.ts"
          fi
          # --no-renames lists both sides of a rename, so moving a workflow out of the folder counts.
          git -c core.quotePath=false diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/files.txt"
          # F9: the repository of the head branch, this repository and its owner (DECISOES § 333). The script of the base
          # before the F9 ignores them; the new one refuses the merge when they are missing.
          jq -n --arg head "$HEAD_REF" --arg author "$AUTHOR" --argjson draft "$DRAFT" \
            --arg headRepo "$HEAD_REPO" --arg repo "$REPO" --arg repoOwner "$REPO_OWNER" \
            --rawfile files "$RUNNER_TEMP/files.txt" \
            '{headRefName: $head, isDraft: $draft, author: {login: $author}, headRepo: $headRepo, repo: $repo, repoOwner: $repoOwner, files: ($files | split("\n") | map(select(length > 0)) | map({path: .}))}' \
            > "$RUNNER_TEMP/pr.json"
          node "$RUNNER_TEMP/ci/pode-mesclar.ts" "$RUNNER_TEMP/pr.json" "$UPDATE_TYPE"
      - name: Comment why it was not merged
        if: steps.decide.outputs.merge != 'true' && steps.decide.outputs.comment == 'true'
        env:
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          gh pr comment "$PR" --body "Merge automático: não. $REASON"
      - name: Merge
        id: merge
        if: steps.decide.outputs.merge == 'true'
        env:
          REASON: ${{ steps.decide.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if gh pr merge "$PR" --squash --delete-branch --match-head-commit "$HEAD_SHA"; then
            sha=''
            for _ in 1 2 3 4 5; do
              sha=$(gh pr view "$PR" --json mergeCommit --jq '.mergeCommit.oid // empty')
              [[ "$sha" =~ ^[0-9a-f]{40}$ ]] && break
              sleep 5
            done
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              gh issue create --title "Merge da PR #$PR sem commit de merge legível" --assignee "$OWNER" --body "O merge aconteceu, mas o commit não apareceu no gh pr view; rode o pós-deploy à mão. Execução: $RUN_URL"
              exit 1
            fi
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            gh pr comment "$PR" --body "Merge automático: o GitHub recusou o merge (conflito ou PR desatualizada). Execução: $RUN_URL"
            gh issue create --title "Merge automático falhou na PR #$PR" --assignee "$OWNER" --body "O job de merge decidiu mesclar ($REASON), mas o gh pr merge falhou. Execução: $RUN_URL"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  # F8 (decision 14; DECISOES § 300): GitHub sends no failure e-mail for a run Dependabot started, so a red CI in a
  # Dependabot PR (ci-ok, or the merge job) opens an issue assigned to the owner, one per PR: a new red run comments
  # on the open one instead of opening another. It also comments on the PR. No checkout: only the gh CLI runs here.
  # !cancelled(): the ci-ok of a cancelled run ends red (it always runs), and that is not a red CI (the review of the F9).
  alerta-dependabot:
    needs: [ci-ok, merge]
    if: failure() && !cancelled() && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      OWNER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Abrir ou comentar a issue
        run: |
          title="CI vermelho na PR #$PR do Dependabot"
          body="O CI da PR #$PR do Dependabot ficou vermelho e o merge automático não aconteceu. Execução: $RUN_URL. O que fazer: docs/OPERACAO.md, seção \"CI vermelho numa PR do Dependabot\"."
          issue=$(gh issue list --state open --limit 100 --json number,title --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --assignee "$OWNER" --body "$body"
          fi
          gh pr comment "$PR" --body "CI vermelho: o merge automático não acontece. A issue \"$title\" avisa o dono do repositório. Execução: $RUN_URL"

  pos-deploy:
    needs: merge
    if: needs.merge.result == 'success' && !cancelled() && needs.merge.outputs.merged == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/pos-deploy.yml
    with:
      commit: ${{ needs.merge.outputs.sha }}
      wait_minutes: 20
