# CI of every PR (ADR-001, item 5): pnpm verificar, then the merge job decides with
# scripts/ci/pode-mesclar.ts, then the post-deploy check runs when the merge happened.
# A merge made with the GITHUB_TOKEN does not fire `push`, so the post-deploy is called here.
# ADR-003: pnpm verificar runs in parts, one job each, in parallel on 2-vCPU runners: every gate but the
# Playwright suite (`verificar`), and the suite split by browser, Chromium in four shards and WebKit in ten
# (`playwright`; F5a, F7 and F8, the adendos of ADR-003). Each part keeps the 900 s limit; together they are the whole of pnpm
# verificar (tests/unit/verificar.test.ts). The Playwright parts run with core dumps off and end with the state of the
# disk and of the core dumps, whatever happened (the ENOSPC of DECISOES § 141; § 154). F8: a Dependabot PR whose CI went
# red tells Victor in an issue assigned to him and in the PR (alerta-dependabot; DECISOES § 300), and every issue the
# workflows open is assigned to the owner of the repository, so GitHub e-mails him (DECISOES § 301).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The gates in two parts since the languages adjustment (DECISOES § 320): every gate but Lighthouse, and Lighthouse alone.
  # A matrix keeps the job id, so the needs of merge and alerta-dependabot wait for both.
  verificar:
    name: verificar (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: portões
            args: --sem-playwright --sem-lighthouse
          - part: lighthouse
            args: --lighthouse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache pinned tools (actionlint, LanguageTool, JRE)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/lib/tools.ts') }}
      # Lighthouse runs on the Chromium of Playwright.
      - if: matrix.part == 'lighthouse'
        run: pnpm exec playwright install --with-deps chromium
      - name: pnpm verificar ${{ matrix.args }}
        run: pnpm verificar ${{ matrix.args }}
        env:
          LINT_TEXTO_BASE: origin/${{ github.event.pull_request.base.ref }}

  playwright:
    name: playwright (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: chromium 1 de 5
            browser: chromium
            args: --playwright=chromium --shard=1/5
          - part: chromium 2 de 5
            browser: chromium
            args: --playwright=chromium --shard=2/5
          - part: chromium 3 de 5
            browser: chromium
            args: --playwright=chromium --shard=3/5
          - part: chromium 4 de 5
            browser: chromium
            args: --playwright=chromium --shard=4/5
          - part: chromium 5 de 5
            browser: chromium
            args: --playwright=chromium --shard=5/5
          - part: webkit 1 de 12
            browser: webkit
            args: --playwright=webkit --shard=1/12
          - part: webkit 2 de 12
            browser: webkit
            args: --playwright=webkit --shard=2/12
          - part: webkit 3 de 12
            browser: webkit
            args: --playwright=webkit --shard=3/12
          - part: webkit 4 de 12
            browser: webkit
            args: --playwright=webkit --shard=4/12
          - part: webkit 5 de 12
            browser: webkit
            args: --playwright=webkit --shard=5/12
          - part: webkit 6 de 12
            browser: webkit
            args: --playwright=webkit --shard=6/12
          - part: webkit 7 de 12
            browser: webkit
            args: --playwright=webkit --shard=7/12
          - part: webkit 8 de 12
            browser: webkit
            args: --playwright=webkit --shard=8/12
          - part: webkit 9 de 12
            browser: webkit
            args: --playwright=webkit --shard=9/12
          - part: webkit 10 de 12
            browser: webkit
            args: --playwright=webkit --shard=10/12
          - part: webkit 11 de 12
            browser: webkit
            args: --playwright=webkit --shard=11/12
          - part: webkit 12 de 12
            browser: webkit
            args: --playwright=webkit --shard=12/12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      # The runner pipes core dumps to systemd-coredump with a fixed size limit in its core_pattern, so ulimit -c 0 alone
      # does not stop them: the pattern goes to /bin/false for the job, and ulimit -c 0 stays in the step (DECISOES § 154).
      - name: Core dumps off
        run: |
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"
          sudo -n sysctl -w kernel.core_pattern='|/bin/false'
      - name: pnpm verificar ${{ matrix.args }}
        run: |
          ulimit -c 0
          pnpm verificar ${{ matrix.args }}
      - name: Disk and core dumps
        if: always()
        run: |
          df -h / /tmp || true
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"
          coredumpctl list --no-pager || true
          journalctl --no-pager -t systemd-coredump -n 40 || true
          sudo -n journalctl -k --no-pager | grep -iE 'oom|killed process|segfault|coredump|no space' | tail -30 || true
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7

  merge:
    needs: [verificar, playwright]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      sha: ${{ steps.merge.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      OWNER: ${{ github.repository_owner }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Dependabot metadata
        id: dependabot
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Decide
        id: decide
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DRAFT: ${{ github.event.pull_request.draft }}
          UPDATE_TYPE: ${{ steps.dependabot.outputs.update-type }}
        run: |
          # The decision script comes from the base branch, so a PR cannot change its own rule.
          # Only the PR that creates the pipeline (no script on the base yet) uses its own copy.
          mkdir -p "$RUNNER_TEMP/ci"
          if git cat-file -e "$BASE_SHA:scripts/ci/pode-mesclar.ts" 2>/dev/null; then
            git show "$BASE_SHA:scripts/ci/pode-mesclar.ts" > "$RUNNER_TEMP/ci/pode-mesclar.ts"
          else
            cp scripts/ci/pode-mesclar.ts "$RUNNER_TEMP/ci/pode-mesclar.ts"
          fi
          # --no-renames lists both sides of a rename, so moving a workflow out of the folder counts.
          git -c core.quotePath=false diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/files.txt"
          jq -n --arg head "$HEAD_REF" --arg author "$AUTHOR" --argjson draft "$DRAFT" \
            --rawfile files "$RUNNER_TEMP/files.txt" \
            '{headRefName: $head, isDraft: $draft, author: {login: $author}, files: ($files | split("\n") | map(select(length > 0)) | map({path: .}))}' \
            > "$RUNNER_TEMP/pr.json"
          node "$RUNNER_TEMP/ci/pode-mesclar.ts" "$RUNNER_TEMP/pr.json" "$UPDATE_TYPE"
      - name: Comment why it was not merged
        if: steps.decide.outputs.merge != 'true' && steps.decide.outputs.comment == 'true'
        env:
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          gh pr comment "$PR" --body "Merge automático: não. $REASON"
      - name: Merge
        id: merge
        if: steps.decide.outputs.merge == 'true'
        env:
          REASON: ${{ steps.decide.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if gh pr merge "$PR" --squash --delete-branch --match-head-commit "$HEAD_SHA"; then
            sha=''
            for _ in 1 2 3 4 5; do
              sha=$(gh pr view "$PR" --json mergeCommit --jq '.mergeCommit.oid // empty')
              [[ "$sha" =~ ^[0-9a-f]{40}$ ]] && break
              sleep 5
            done
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              gh issue create --title "Merge da PR #$PR sem commit de merge legível" --assignee "$OWNER" --body "O merge aconteceu, mas o commit não apareceu no gh pr view; rode o pós-deploy à mão. Execução: $RUN_URL"
              exit 1
            fi
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            gh pr comment "$PR" --body "Merge automático: o GitHub recusou o merge (conflito ou PR desatualizada). Execução: $RUN_URL"
            gh issue create --title "Merge automático falhou na PR #$PR" --assignee "$OWNER" --body "O job de merge decidiu mesclar ($REASON), mas o gh pr merge falhou. Execução: $RUN_URL"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  # F8 (decision 14; DECISOES § 300): GitHub sends no failure e-mail for a run Dependabot started, so a red CI in a
  # Dependabot PR (any part, or the merge job) opens an issue assigned to the owner, one per PR: a new red run comments
  # on the open one instead of opening another. It also comments on the PR. No checkout: only the gh CLI runs here.
  alerta-dependabot:
    needs: [verificar, playwright, merge]
    if: failure() && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      OWNER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Abrir ou comentar a issue
        run: |
          title="CI vermelho na PR #$PR do Dependabot"
          body="O CI da PR #$PR do Dependabot ficou vermelho e o merge automático não aconteceu. Execução: $RUN_URL. O que fazer: docs/OPERACAO.md, seção \"CI vermelho numa PR do Dependabot\"."
          issue=$(gh issue list --state open --limit 100 --json number,title --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --assignee "$OWNER" --body "$body"
          fi
          gh pr comment "$PR" --body "CI vermelho: o merge automático não acontece. A issue \"$title\" avisa o dono do repositório. Execução: $RUN_URL"

  pos-deploy:
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/pos-deploy.yml
    with:
      commit: ${{ needs.merge.outputs.sha }}
      wait_minutes: 20
